# SonarCloud automatic-analysis settings.
# design/** is vendored design reference — the decompiled Console mockup and
# the Forward Design System spec (INTERFACE-BIBLE) — documentation, not
# product code.
sonar.exclusions=design/**
# nav.ts is a declarative config of uniform { id, label, icon, path, perm }
# records; the copy/paste detector flags the repeated shape as duplication,
# which is noise for a config list.
sonar.cpd.exclusions=**/components/console/shell/nav.ts
