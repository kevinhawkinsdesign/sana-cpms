name: Deploy static demo to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/sana-cpms-demo-replica-wkuzr0
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment at a time; let an in-flight one finish rather
# than cancelling it mid-publish.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # This repo has no separate backend — every /api/* call is answered
      # client-side (see lib/mock/browserIntercept.ts), so the whole app
      # exports as static HTML/JS with no server behind it. STATIC_EXPORT
      # switches next.config.ts into output:'export' mode with the
      # /sana-cpms basePath GitHub Pages project sites need.
      - run: npm run build
        env:
          STATIC_EXPORT: "true"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
